  # --- High-rate saturation sweep (issue #2993) ---
  # Engine pinned to core 0, backend to core 1 (each on its own physical core).
  # Loadgen uses cores 2-15 (14 isolated physical cores); cores 16/17 are the
  # HT siblings of engine/backend and are deliberately left idle. Higher rates
  # are achieved by raising per-core signals_per_second rather than adding cores,
  # since the contiguous loadgen range cannot grow past 15 without touching 16/17.
  - name: 1400k
    from_template:
      path: ../pipeline_perf_test/test_suites/comparison_dashboard/templates/steps/df-engine.yaml
      variables:{{ forward_variables() }}
        data_dir: {{data_dir}}
