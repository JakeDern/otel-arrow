# Integration report for logs using engine-pushed metrics.
#
# The load generator, engine and backend push their internal metrics over
# OTLP to the orchestrator's embedded metrics sink (table `pushed_metrics`).
# Pushed counters are deltas stamped by the engine, and each engine performs a
# final flush after its pipelines drain during graceful shutdown. This gives:
#
#   * Loss: exact whole-run totals. SUM of every delta for the test, which
#     includes the post-drain final flush. No sampling-window skew between
#     sender and receiver, so loss can no longer go negative because of
#     measurement artifacts.
#   * Throughput: SUM of deltas whose engine-assigned interval end falls in
#     the observation window, divided by the span those intervals cover.
#
# Container CPU / memory / network still come from the docker monitor
# (`metrics` table) and are computed exactly as in integration_report_logs.yaml.
# Scrape-based send/receive values are also reported (suffix `_scrape`) for
# comparison while the push path is being validated.
queries:
  - name: Filter superflous metadata
    sql: |
      CREATE VIEW metadata_filtered AS
      SELECT *
      FROM metadata
      WHERE Attribute NOT LIKE 'test.ctx.%';

  - name: Calculate observation window for this test
    sql: |
      CREATE TABLE observation_window AS WITH event_times AS (
        SELECT
          "attributes.test.name" AS test_name,
          name AS event_name,
          TO_TIMESTAMP(timestamp / 1000000000.0) AS timestamp
        FROM events
        WHERE name IN ('observation_start', 'observation_stop')
      ),
      observation_windows AS (
        SELECT
          start.test_name,
          start.timestamp AS start_ts,
          stop.timestamp AS stop_ts
        FROM
          event_times start
          JOIN event_times stop ON start.test_name = stop.test_name
        WHERE
          start.event_name = 'observation_start'
          AND stop.event_name = 'observation_stop'
          AND start.timestamp < stop.timestamp
      )

      SELECT
        w.*
      FROM
        metadata_row
        JOIN observation_windows w ON metadata_row."test.name" = w.test_name

  # ---------------------------------------------------------------------
  # Pushed send / receive counters
  # ---------------------------------------------------------------------
  - name: Pushed send/receive deltas for this test
    sql: |
      CREATE TABLE pushed_send_receive AS
      WITH this_test AS (
        SELECT * FROM pushed_metrics
        WHERE "resource_attributes.test.name" = (SELECT "test.name" FROM metadata_row LIMIT 1)
          AND temporality = 'delta'
      )
      SELECT
        'logs_produced' AS metric_name,
        "resource_attributes.service.name" AS component_name,
        "scope_attributes.core.id" AS core_id,
        start_time, time, value
      FROM this_test
      WHERE scope_name = 'receiver.traffic_generator'
        AND metric_name = 'logs.produced'

      UNION ALL

      SELECT
        'logs_bytes_produced' AS metric_name,
        "resource_attributes.service.name" AS component_name,
        "scope_attributes.core.id" AS core_id,
        start_time, time, value
      FROM this_test
      WHERE scope_name = 'receiver.traffic_generator'
        AND metric_name = 'logs.bytes.produced'

      UNION ALL

      SELECT
        'logs' AS metric_name,
        "resource_attributes.service.name" AS component_name,
        "scope_attributes.core.id" AS core_id,
        start_time, time, value
      FROM this_test
      WHERE "resource_attributes.service.name" = 'backend-service'
        AND scope_name = 'node.input'
        AND metric_name = 'items'
        AND "scope_attributes.node.id" = 'perf'
        AND "metric_attributes.signal" = 'logs'
        AND "metric_attributes.outcome" = 'success';

  - name: Whole-run pushed totals
    sql: |
      CREATE TABLE pushed_totals AS
      SELECT
        metric_name,
        component_name,
        SUM(value) AS total,
        COUNT(*) AS data_points,
        MIN(start_time) AS first_start,
        MAX(time) AS last_end
      FROM pushed_send_receive
      GROUP BY metric_name, component_name
      ORDER BY metric_name, component_name;

  - name: Observation window pushed totals
    sql: |
      -- Deltas whose engine-assigned interval end lies inside the observation
      -- window. The covered span is measured per metric from the engine's own
      -- interval boundaries rather than from orchestrator wall-clock events.
      CREATE TABLE pushed_window_totals AS
      SELECT
        p.metric_name,
        SUM(p.value) AS total_increase,
        EXTRACT(EPOCH FROM (MAX(p.time) - MIN(p.start_time))) AS covered_seconds
      FROM pushed_send_receive p
      CROSS JOIN observation_window ow
      WHERE p.time > ow.start_ts AND p.time <= ow.stop_ts
      GROUP BY p.metric_name;

  - name: Calculate loss
    sql: |
      CREATE TABLE log_loss AS
      WITH t AS (
        SELECT
          COALESCE((SELECT SUM(total) FROM pushed_totals WHERE metric_name = 'logs_produced'), 0) AS produced,
          COALESCE((SELECT SUM(total) FROM pushed_totals WHERE metric_name = 'logs'), 0) AS received
      )
      SELECT
        produced AS logs_produced,
        received AS logs_received,
        produced - received AS logs_lost,
        CASE WHEN produced > 0 THEN (produced - received) * 1.0 / produced ELSE NULL END AS logs_lost_pct
      FROM t;

  - name: Calculate log throughput rates
    sql: |
      CREATE TABLE log_throughput_rates AS
      SELECT
        metric_name,
        total_increase,
        covered_seconds,
        total_increase / NULLIF(covered_seconds, 0) AS logs_per_second
      FROM pushed_window_totals
      WHERE metric_name IN ('logs_produced', 'logs');

  # ---------------------------------------------------------------------
  # Legacy scrape-based values (kept for side-by-side comparison only)
  # ---------------------------------------------------------------------
  - name: Scrape-based send/receive (comparison only)
    sql: |
      CREATE TABLE scrape_send_receive AS
      WITH metrics_filtered AS (
        SELECT
          CASE WHEN metric_name = 'items' THEN 'logs' ELSE metric_name END AS metric_name,
          "metric_attributes.component_name" AS component_name,
          COALESCE("metric_attributes.otel_scope_core_id", 'N/A') AS core_id,
          timestamp, value
        FROM metrics
        WHERE metric_name IN ('logs_produced', 'items')
          AND (
            metric_name <> 'items'
            OR (
              "metric_attributes.otel_scope_name" = 'node.input'
              AND "metric_attributes.otel_scope_node_id" = 'perf'
              AND "metric_attributes.signal" = 'logs'
              AND "metric_attributes.outcome" = 'success'
            )
          )
      ),
      per_series AS (
        SELECT m.metric_name, m.component_name, m.core_id,
               MAX(m.value) - MIN(m.value) AS total_increase
        FROM metrics_filtered m
        JOIN observation_window ow ON m.timestamp BETWEEN ow.start_ts AND ow.stop_ts
        GROUP BY m.metric_name, m.component_name, m.core_id
      )
      SELECT metric_name, SUM(total_increase) AS total_increase
      FROM per_series
      GROUP BY metric_name;

  - name: Scrape-based loss (comparison only)
    sql: |
      CREATE TABLE log_loss_scrape AS
      WITH t AS (
        SELECT
          COALESCE((SELECT total_increase FROM scrape_send_receive WHERE metric_name = 'logs_produced'), 0) AS produced,
          COALESCE((SELECT total_increase FROM scrape_send_receive WHERE metric_name = 'logs'), 0) AS received
      )
      SELECT
        produced AS logs_produced,
        received AS logs_received,
        produced - received AS logs_lost,
        CASE WHEN produced > 0 THEN (produced - received) * 1.0 / produced ELSE NULL END AS logs_lost_pct
      FROM t;

  # ---------------------------------------------------------------------
  # Container resource metrics (unchanged; docker monitor)
  # ---------------------------------------------------------------------
  - name: Container Network Rates
    sql: |
      CREATE TABLE container_network_rates AS WITH
        metrics_filtered AS (
            SELECT *,
            "metric_attributes.component_name" AS component_name,
            FROM metrics
            WHERE metric_name IN (
              'container.network.rx',
              'container.network.tx'
            ) AND timestamp > (
                SELECT CAST("test.start" AS TIMESTAMP WITH TIME ZONE)
                FROM metadata_row
                LIMIT 1
              )
        ),
        with_lag AS (
            SELECT *,
                  LAG(value) OVER (PARTITION BY metric_name, component_name  ORDER BY timestamp) AS prev_value,
                  LAG(timestamp) OVER (PARTITION BY metric_name, component_name ORDER BY timestamp) AS prev_timestamp
            FROM metrics_filtered
        ),
        with_rate AS (
            SELECT *,
                  value - prev_value AS delta,
                  EXTRACT(EPOCH FROM timestamp - prev_timestamp) AS time_delta_seconds,
                  CASE
                      WHEN prev_value IS NULL OR time_delta_seconds = 0 THEN NULL
                      ELSE (value - prev_value) / time_delta_seconds
                  END AS rate
            FROM with_lag
        )
        SELECT
          component_name,
          metric_name,
          MAX(value) - MIN(value) AS total_increase,
          AVG(rate) AS average_rate
        FROM
          observation_window AS ow
        JOIN
          with_rate AS wr
          ON wr.timestamp BETWEEN ow.start_ts AND ow.stop_ts
        GROUP BY component_name, metric_name

  - name: Calculate component core counts
    sql: |
      CREATE TABLE component_core_counts AS
        WITH allocated AS (
          SELECT
            "metric_attributes.component_name" AS component_name,
            MAX(value) AS core_count
          FROM metrics
          WHERE metric_name = 'container.cpu.allocated'
          GROUP BY "metric_attributes.component_name"
        ),
        system_cores AS (
          SELECT DISTINCT
            "metric_attributes.component_name" AS component_name,
            (SELECT MAX(value) FROM metrics WHERE metric_name = 'container.cpu.usage') AS system_cpu_count
          FROM metrics
          WHERE metric_name IN ('container.cpu.usage', 'process.cpu.usage')
        )
        SELECT
          s.component_name,
          COALESCE(a.core_count, s.system_cpu_count) AS core_count
        FROM system_cores s
        LEFT JOIN allocated a ON s.component_name = a.component_name;

  - name: Create component metric aggregates
    sql: |
      CREATE TABLE component_resource_metrics AS
        WITH metrics_filtered AS (
          SELECT *,
          "metric_attributes.component_name" AS component_name,
          FROM metrics
          WHERE metric_name IN ('process.cpu.usage', 'process.memory.usage', 'container.cpu.usage', 'container.memory.usage')
        )
        SELECT
          m.component_name,
          metric_name,
          MIN(m.value) AS min_value,
          AVG(m.value) AS avg_value,
          MAX(m.value) AS max_value
        FROM
          observation_window AS ow
        JOIN
          metrics_filtered AS m
          ON m.timestamp BETWEEN ow.start_ts AND ow.stop_ts
        GROUP BY
          m.component_name, m.metric_name
        ORDER BY
          m.component_name DESC;

  - name: Create Final Github Actions Format table
    sql: |
      CREATE TABLE gh_actions_benchmark AS
          SELECT 'dropped_logs_percentage' AS name, '%' AS unit, CAST(logs_lost_pct AS FLOAT) * 100 AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - Dropped Logs %' AS extra
          FROM log_loss
          CROSS JOIN metadata_row

          UNION ALL

          SELECT 'cpu_percentage_normalized_avg' AS name, '%' AS unit,
                (crm.avg_value / COALESCE(ccc.core_count, 1)) * 100 AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - CPU % (Normalized)' AS extra
          FROM component_resource_metrics crm
          CROSS JOIN metadata_row
          LEFT JOIN component_core_counts ccc ON crm.component_name = ccc.component_name
          WHERE crm.component_name IN ('go-collector', 'df-engine') AND crm.metric_name IN ('container.cpu.usage', 'process.cpu.usage')

          UNION ALL

          SELECT 'cpu_percentage_normalized_max' AS name, '%' AS unit,
                (crm.max_value / COALESCE(ccc.core_count, 1)) * 100 AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - CPU % (Normalized)' AS extra
          FROM component_resource_metrics crm
          CROSS JOIN metadata_row
          LEFT JOIN component_core_counts ccc ON crm.component_name = ccc.component_name
          WHERE crm.component_name IN ('go-collector', 'df-engine') AND crm.metric_name IN ('container.cpu.usage', 'process.cpu.usage')

          UNION ALL

          SELECT 'ram_mib_avg' AS name, 'MiB' AS unit, avg_value / 1024 / 1024 AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - RAM (MiB)' AS extra
          FROM component_resource_metrics
          CROSS JOIN metadata_row
          WHERE component_name IN ('go-collector', 'df-engine') AND metric_name IN ('container.memory.usage', 'process.memory.usage')

          UNION ALL

          SELECT 'ram_mib_max' AS name, 'MiB' AS unit, max_value / 1024 / 1024 AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - RAM (MiB)' AS extra
          FROM component_resource_metrics
          CROSS JOIN metadata_row
          WHERE component_name IN ('go-collector', 'df-engine') AND metric_name IN ('container.memory.usage', 'process.memory.usage')

          UNION ALL

          SELECT 'logs_produced_rate' AS name, 'logs/sec' AS unit, logs_per_second AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - Log Throughput' AS extra
          FROM log_throughput_rates
          CROSS JOIN metadata_row
          WHERE metric_name = 'logs_produced'

          UNION ALL

          SELECT 'logs_received_rate' AS name, 'logs/sec' AS unit, logs_per_second AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - Log Throughput' AS extra
          FROM log_throughput_rates
          CROSS JOIN metadata_row
          WHERE metric_name = 'logs'

          UNION ALL

          SELECT 'test_duration' AS name, 'seconds' AS unit,
                EXTRACT(EPOCH FROM (stop_ts - start_ts)) AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - Test Duration' AS extra
          FROM observation_window
          CROSS JOIN metadata_row

          UNION ALL

          SELECT 'network_tx_bytes_rate_avg' AS name, 'bytes/sec' AS unit, average_rate AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - Network Utilization' AS extra
          FROM container_network_rates
          CROSS JOIN metadata_row
          WHERE metric_name = 'container.network.tx' AND component_name IN ('go-collector', 'df-engine')

          UNION ALL

          SELECT 'network_rx_bytes_rate_avg' AS name, 'bytes/sec' AS unit, average_rate AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - Network Utilization' AS extra
          FROM container_network_rates
          CROSS JOIN metadata_row
          WHERE metric_name = 'container.network.rx' AND component_name IN ('go-collector', 'df-engine')

          UNION ALL

          SELECT 'egress_bytes_per_log' AS name, 'bytes/log' AS unit,
                CASE WHEN ltr.logs_per_second > 0
                  THEN cnr.average_rate / ltr.logs_per_second
                  ELSE NULL
                END AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - Egress Bytes Per Log' AS extra
          FROM container_network_rates cnr
          CROSS JOIN log_throughput_rates ltr
          CROSS JOIN metadata_row
          WHERE cnr.metric_name = 'container.network.tx'
            AND cnr.component_name IN ('go-collector', 'df-engine')
            AND ltr.metric_name = 'logs'

          UNION ALL

          SELECT 'uncompressed_bytes_per_log' AS name, 'bytes/log' AS unit,
                CASE WHEN logs.total > 0
                  THEN bytes.total / logs.total
                  ELSE NULL
                END AS value,
                metadata_row."test.suite" || '/' || metadata_row."test.name" || ' - Uncompressed Bytes Per Log' AS extra
          FROM pushed_totals bytes
          JOIN pushed_totals logs ON logs.metric_name = 'logs_produced'
            AND logs.component_name = bytes.component_name
          CROSS JOIN metadata_row
          WHERE bytes.metric_name = 'logs_bytes_produced';

  - name: Push vs scrape comparison
    sql: |
      CREATE TABLE push_vs_scrape AS
      SELECT
        m."test.name" AS test_name,
        p.logs_produced AS push_produced,
        p.logs_received AS push_received,
        p.logs_lost_pct * 100 AS push_lost_pct,
        s.logs_produced AS scrape_produced,
        s.logs_received AS scrape_received,
        s.logs_lost_pct * 100 AS scrape_lost_pct,
        (SELECT logs_per_second FROM log_throughput_rates WHERE metric_name = 'logs_produced') AS push_produced_rate,
        (SELECT logs_per_second FROM log_throughput_rates WHERE metric_name = 'logs') AS push_received_rate,
        (SELECT total_increase / NULLIF(EXTRACT(EPOCH FROM (ow.stop_ts - ow.start_ts)), 0)
           FROM scrape_send_receive, observation_window ow WHERE metric_name = 'logs_produced') AS scrape_produced_rate,
        (SELECT total_increase / NULLIF(EXTRACT(EPOCH FROM (ow.stop_ts - ow.start_ts)), 0)
           FROM scrape_send_receive, observation_window ow WHERE metric_name = 'logs') AS scrape_received_rate
      FROM log_loss p, log_loss_scrape s, metadata_row m;

write_tables:
  push_vs_scrape:
    path_template: "results/integration/push-vs-scrape/{{ metadata['test.name'] }}.json"
    format: json

result_tables:
  - name: push_vs_scrape
    description: (Validation only) Side-by-side push and scrape loss / throughput for the same run.
  - name: metadata_filtered
    description: Information about the test suite and report.
  - name: pushed_totals
    description: Whole-run totals of engine-pushed send/receive counters (includes final post-drain flush).
  - name: component_resource_metrics
    description: CPU and Memory metrics for the components in the Test Suite during the test.
  - name: log_loss
    description: Lost logs computed from whole-run pushed totals (produced - received).
  - name: log_loss_scrape
    description: (Comparison only) Lost logs computed from the legacy scraped counters over the observation window.
  - name: log_throughput_rates
    description: Log throughput (logs/sec) from pushed deltas whose interval ends inside the observation window.
  - name: gh_actions_benchmark
    description: The final metrics used with gh_actions_benchmark.
    finite_columns: [value]
    required_values:
      name:
        - dropped_logs_percentage
        - cpu_percentage_normalized_avg
        - cpu_percentage_normalized_max
        - ram_mib_avg
        - ram_mib_max
        - logs_produced_rate
        - logs_received_rate
        - test_duration
        - network_tx_bytes_rate_avg
        - network_rx_bytes_rate_avg
        - egress_bytes_per_log
