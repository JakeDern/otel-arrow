name: Nightly - Backpressure
hooks:
  run:
    pre:
      - start_otlp_metrics_sink:
          endpoint: 0.0.0.0:14317
    post:
      - stop_otlp_metrics_sink: {}
components:
  load-generator:
    deployment:
      docker:
        image: df_engine:latest
        network: testbed
        extra_hosts:
          host.docker.internal: host-gateway
        ports:
          - "8085:8080"
        # Build doesn't support extra contexts, which are currently needed to get the protos compiled.
        # run the docker build as an external step for now.
        # e.g. - from the ../../rust/otap-dataflow dir:
        # $ docker build --build-context otel-arrow=../../ -f Dockerfile -t df_engine .
        # build:
        #   context: ../../rust/otap-dataflow/
        #   ags:
        ###   This doesn't work.
        #     build-context: 'otel-arrow=../../'
        volumes:
          - 'test_suites/integration/configs/loadgen/config.rendered.yaml:/home/nonroot/config.yaml:ro'
        command:
          - "--config"
          - "./config.yaml"
          - "--core-id-range"
          - "2-2"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 1  # Matches core-id-range: 2-2
  df-engine:
    deployment:
      docker:
        image: df_engine:latest
        network: testbed
        extra_hosts:
          host.docker.internal: host-gateway
        ports:
          - "8086:8080"
        volumes:
          - 'test_suites/integration/configs/engine/config.rendered.yaml:/home/nonroot/config.yaml:ro'
        command:
          - "--config"
          - "./config.yaml"
          - "--core-id-range"
          - "3-3"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 1  # Matches core-id-range: 3-3
  backend-service:
    deployment:
      docker:
        image: df_engine:latest
        network: testbed
        extra_hosts:
          host.docker.internal: host-gateway
        ports:
          - "8087:8080"
        volumes:
          - 'test_suites/integration/configs/backend/config.rendered.yaml:/home/nonroot/config.yaml:ro'
        command:
          - "--config"
          - "./config.yaml"
          - "--core-id-range"
          - "1-1"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 1  # Matches core-id-range: 1-1

tests:
  - name: OTLP-ATTR-OTLP
    from_template:
      path: test_suites/integration/templates/test_steps/df-loadgen-steps-docker-push.yaml
      variables:
        test_name: OTLP-ATTR-OTLP
        result_dir: "nightly_backpressure"
        engine_config_template: test_suites/integration/templates/configs/engine/backpressure/otlp-attr-otlp.yaml.j2
        loadgen_exporter_type: otlp
        backend_receiver_type: otlp
        observation_interval: 60
  - name: OTAP-ATTR-OTLP
    from_template:
      path: test_suites/integration/templates/test_steps/df-loadgen-steps-docker-push.yaml
      variables:
        test_name: OTAP-ATTR-OTLP
        result_dir: "nightly_backpressure"
        engine_config_template: test_suites/integration/templates/configs/engine/backpressure/otap-attr-otlp.yaml.j2
        loadgen_exporter_type: otap
        backend_receiver_type: otlp
        observation_interval: 60
