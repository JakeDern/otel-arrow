# Passthrough test OTAP variant (no processor in middle)
# NUMA-aware layout: SUT on NUMA node 0, loadgen+backend on NUMA node 1
# Uses more loadgen/backend cores than OTLP variant since OTAP is much faster.
name: Continuous - Passthrough OTAP
hooks:
  run:
    pre:
      - start_otlp_metrics_sink:
          endpoint: 0.0.0.0:14317
    post:
      - stop_otlp_metrics_sink: {}
components:
  load-generator:
    deployment:
      docker:
        image: df_engine:latest
        network: testbed
        extra_hosts:
          host.docker.internal: host-gateway
        ports:
          - "8085:8080"
        volumes:
          - 'test_suites/integration/configs/loadgen/config.rendered.yaml:/home/nonroot/config.yaml:ro'
        command:
          - "--config"
          - "./config.yaml"
          - "--core-id-range"
          - "32-39"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 8
  df-engine:
    deployment:
      docker:
        image: df_engine:latest
        network: testbed
        extra_hosts:
          host.docker.internal: host-gateway
        ports:
          - "8086:8080"
        volumes:
          - 'test_suites/integration/configs/engine/config.rendered.yaml:/home/nonroot/config.yaml:ro'
        command:
          - "--config"
          - "./config.yaml"
          - "--core-id-range"
          - "0-0"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 1
  backend-service:
    deployment:
      docker:
        image: df_engine:latest
        network: testbed
        extra_hosts:
          host.docker.internal: host-gateway
        ports:
          - "8087:8080"
        volumes:
          - 'test_suites/integration/configs/backend/config.rendered.yaml:/home/nonroot/config.yaml:ro'
        command:
          - "--config"
          - "./config.yaml"
          - "--core-id-range"
          - "40-43"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 4

tests:
  - name: OTAP-OTAP
    from_template:
      path: test_suites/integration/templates/test_steps/df-loadgen-steps-docker-push.yaml
      variables:
        test_name: OTAP-OTAP
        result_dir: continuous_passthrough
        engine_config_template: test_suites/integration/templates/configs/engine/passthrough/otap-otap.yaml.j2
        loadgen_exporter_type: otap
        backend_receiver_type: otap
        observation_interval: 60
        signals_per_second: null
        max_batch_size: 512
