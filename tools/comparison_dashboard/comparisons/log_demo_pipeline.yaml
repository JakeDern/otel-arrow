slug: log_demo_pipeline
name: Log Demo Pipeline (Multi Rate)
description: >
  Reproduction of an external DFE vs OTC benchmark. OTLP logs go through a
  regex transform (severity_text=ERROR where the body matches
  error|exception|panic|fatal, about 6% of records; email-PII flag plus a
  sha256 body redaction where the body contains an email, about 4%), static
  resource enrichment, a severity filter (INFO and above, which drops nothing
  for synthetic data), a batch processor (8192 items / 200ms) and OTLP/HTTP
  gzip export. "Wait" suites set wait_for_result=true on the DFE receiver and
  the OTC exporter queue. "No Wait" suites keep the original configs'
  defaults (false).

chart:
  axes:
    x:
      title: Generated Load (logs/sec)
      description: Rate at which the load generator is configured to produce logs e.g. "100k" == "100,000 logs/sec".

tests:
  - name: 10k
    loadgen_rate: 10000
  - name: 50k
    loadgen_rate: 50000
  - name: 100k
    loadgen_rate: 100000
  - name: 200k
    loadgen_rate: 200000
  - name: 300k
    loadgen_rate: 300000
  - name: 400k
    loadgen_rate: 400000
  - name: 600k
    loadgen_rate: 600000
  - name: 800k
    loadgen_rate: 800000
  - name: 1000k
    loadgen_rate: 1000000
    label: 1M

suites:
  - name: DFE OTLP Demo Pipeline
    slug: dfe_logs_otlp_gzip_demo_pipeline
    short: DFE/Wait
  - name: DFE OTLP Demo Pipeline No Wait
    slug: dfe_logs_otlp_gzip_demo_pipeline_nowait
    short: DFE/No Wait
  - name: OTC OTLP Demo Pipeline
    slug: otc_logs_otlp_gzip_demo_pipeline
    short: OTC/Wait
  - name: OTC OTLP Demo Pipeline No Wait
    slug: otc_logs_otlp_gzip_demo_pipeline_nowait
    short: OTC/No Wait
