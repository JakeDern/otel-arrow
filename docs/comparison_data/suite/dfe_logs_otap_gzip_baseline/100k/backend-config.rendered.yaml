version: otel_dataflow/v1
policies:
  telemetry:
    runtime_metrics: normal
  channel_capacity:
    control:
      pipeline: 100
      node: 100
    pdata: 100
  resources:
    core_allocation:
      type: core_set
      set:
        - start: 1
          end: 1

engine:
  telemetry:
    # Keep metric sets of stopped pipelines scrapeable so the final counts
    # survive the drain that precedes the last scrape (see #2731).
    metric_unregister_grace_period: 5s

groups:
  default:
    pipelines:
      main:
        nodes:
          receiver:
            type: "urn:otel:receiver:otap"
            config:
              listening_addr: "0.0.0.0:1235"
              response_stream_channel_size: 100
              compression_method: gzip

          perf:
            type: "urn:otel:exporter:perf"
            policies:
              telemetry:
                item_counts: true
            config:
              frequency: 500
              cpu_usage: false
              mem_usage: false
              disk_usage: false
              io_usage: false

        connections:
          - from: receiver
            to: perf