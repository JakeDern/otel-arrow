[package]
name = "otel-arrow-dfe-quiver"
description = "Embeddable Arrow-based segment store"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = true
rust-version.workspace = true
keywords = ["telemetry", "opentelemetry", "otlp", "otap", "arrow"]
categories = ["database-implementations"]

[lib]
name = "otel_arrow_dfe_quiver"
path = "src/lib.rs"

[features]
default = ["otap-dataflow-integrations", "mmap"]
otap-dataflow-integrations = []
serde = ["dep:serde"]
mmap = ["dep:memmap2"]

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-cast.workspace = true
arrow-schema.workspace = true
arrow-ipc.workspace = true
arrow-select.workspace = true
bytes.workspace = true
crc32fast.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["fs", "sync", "time"] }
tokio-util = { workspace = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
memmap2 = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true

[lints]
workspace = true

# Turmoil deterministic-simulation POC. Turmoil is only linked when the crate is
# built with `--cfg quiver_turmoil` (see src/fs_compat.rs). It is NOT enabled by
# `--all-features`, so normal and CI builds are unaffected. The lib's fs_compat
# module references turmoil under that cfg, so it must be a normal (not dev)
# dependency. Run the sim tests via:
#   CARGO_TARGET_DIR=target/turmoil RUSTFLAGS="--cfg quiver_turmoil" \
#     cargo test -p otel-arrow-dfe-quiver turmoil
[target.'cfg(quiver_turmoil)'.dependencies]
turmoil = { version = "0.7.2", features = ["unstable-fs", "unstable-barriers"] }

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "segment"
harness = false

[[bench]]
name = "startup"
harness = false
